<svg xmlns="http://www.w3.org/2000/svg" width="340" height="64" viewBox="0 0 340 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#196c2e" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Button Background -->
  <rect x="2" y="2" width="336" height="60" rx="30" fill="url(#bgGrad)" stroke="#3fb950" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Left Icon Circle -->
  <circle cx="32" cy="32" r="20" fill="#ffffff" fill-opacity="0.2" />
  
  <!-- Android / Download Icon inside circle -->
  <g transform="translate(22, 22)" fill="#ffffff">
    <!-- Download Arrow -->
    <path d="M10 2v10H6l4 5 4-5h-4V2h-4z" />
    <path d="M4 16h12v2H4v-2z" />
  </g>

  <!-- Texts -->
  <text x="64" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#d1fae5" letter-spacing="1.2">
    ALWAYS LATEST RELEASE
  </text>
  <text x="64" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">
    Download Latest APK
  </text>

  <!-- Right Pill Badge -->
  <rect x="272" y="20" width="50" height="24" rx="12" fill="url(#badgeGrad)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />
  <text x="297" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
    APK
  </text>
</svg>

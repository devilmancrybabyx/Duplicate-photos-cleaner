name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.1.6)'
        required: false
        default: 'v1.1.6'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build APKs with Gradle
        run: ./gradlew assembleRelease assembleDebug --stacktrace --info

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="v1.1.6"
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

      - name: Prepare APK Artifacts for Release
        id: prepare_apks
        run: |
          TAG="${{ steps.release_tag.outputs.TAG }}"
          mkdir -p release_artifacts
          
          # Find and copy release APK (versioned + permanent 'latest' alias)
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release_artifacts/DupeCleaner-${TAG}-release.apk
            cp app/build/outputs/apk/release/app-release.apk release_artifacts/DupeCleaner-release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release_artifacts/DupeCleaner-${TAG}-release.apk
            cp app/build/outputs/apk/release/app-release-unsigned.apk release_artifacts/DupeCleaner-release.apk
          fi

          # Find and copy debug APK (versioned + permanent 'latest' alias)
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release_artifacts/DupeCleaner-${TAG}-debug.apk
            cp app/build/outputs/apk/debug/app-debug.apk release_artifacts/DupeCleaner-debug.apk
          fi

          ls -la release_artifacts/

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DupeCleaner-APKs
          path: release_artifacts/*

      - name: Publish GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.TAG }}
          name: "Dupe cleaner ${{ steps.release_tag.outputs.TAG }}"
          body: |
            ## 📸 Dupe cleaner ${{ steps.release_tag.outputs.TAG }}

            ### 🚀 What's New in v1.1.6:
            - **🧠 Advanced Filter & Color Invariant Detection (DCT pHash)**: Integrated 64-bit Discrete Cosine Transform frequency-domain perceptual hashing. Photos with heavy filters, black & white conversion, sepia tints, contrast adjustments, saturation boosts, and exposure edits are now accurately recognized as similar.
            - **📐 Multi-Crop & Zoom Detection (Aspect-Ratio & Inset Crops)**: Extracted multi-region perceptual hashes (Center-Square 1:1 and Center-Inset 75% zoom). Photos cropped to different aspect ratios (e.g., 16:9 to 1:1, 4:3 to 1:1) or zoomed in on the subject are now detected as similar media.
            - **⚡ Fast & Memory Efficient**: Sub-millisecond mathematical DCT transform with zero memory overhead or background lag.

            ### 📦 Download Assets:
            - `DupeCleaner-release.apk`: **Direct permanent download link** (always fetches the latest release APK).
            - `DupeCleaner-${{ steps.release_tag.outputs.TAG }}-release.apk`: Versioned signed release build.
            - `DupeCleaner-${{ steps.release_tag.outputs.TAG }}-debug.apk`: Debug build with developer inspection tools.
          files: release_artifacts/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

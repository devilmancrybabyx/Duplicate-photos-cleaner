name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build APKs with Gradle
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Prepare APK Artifacts for Release
        id: prepare_apks
        run: |
          mkdir -p release_artifacts
          
          # Find and copy release APK
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release_artifacts/PhotoDedupPro-v1.0.0-release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release_artifacts/PhotoDedupPro-v1.0.0-release.apk
          fi

          # Find and copy debug APK
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release_artifacts/PhotoDedupPro-v1.0.0-debug.apk
          fi

          ls -la release_artifacts/

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhotoDedupPro-APKs
          path: release_artifacts/*

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="v1.0.0"
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.TAG }}
          name: "Photo Dedup Pro ${{ steps.release_tag.outputs.TAG }}"
          body: |
            ## 📸 Photo Dedup Pro ${{ steps.release_tag.outputs.TAG }}

            ### ✨ Key Features:
            - **Perceptual Difference Hashing (dHash)**: Scaled 9×8 grayscale gradient hash clustering with Hamming Distance ($\le 8$) for visually similar photos, burst shots, and compressed copies.
            - **Cryptographic SHA-256 Matching**: Fast file size + SHA-256 matching for 100% exact duplicate verification.
            - **Scoped Storage & Safe Deletion**: Android 11+ MediaStore `createDeleteRequest` compliant with system trash & confirmation dialogs.
            - **Jetpack Compose Material 3 UI**: Full dark theme, interactive swipe inspection pager modal, live progress reporting, smart selection, and group/global sorting.

            ### 📦 Download Assets:
            - `PhotoDedupPro-v1.0.0-release.apk`: Signed release build ready to install.
            - `PhotoDedupPro-v1.0.0-debug.apk`: Debug build with inspection tools.
          files: release_artifacts/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

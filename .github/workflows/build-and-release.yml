name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.1.3)'
        required: false
        default: 'v1.1.3'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build APKs with Gradle
        run: ./gradlew assembleRelease assembleDebug --stacktrace --info

      - name: Prepare APK Artifacts for Release
        id: prepare_apks
        run: |
          mkdir -p release_artifacts
          
          # Find and copy release APK
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release_artifacts/DupeCleaner-v1.1.3-release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release_artifacts/DupeCleaner-v1.1.3-release.apk
          fi

          # Find and copy debug APK
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release_artifacts/DupeCleaner-v1.1.3-debug.apk
          fi

          ls -la release_artifacts/

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DupeCleaner-APKs
          path: release_artifacts/*

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="v1.1.3"
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.TAG }}
          name: "Dupe cleaner ${{ steps.release_tag.outputs.TAG }}"
          body: |
            ## 📸 Dupe cleaner ${{ steps.release_tag.outputs.TAG }}

            ### 🚀 What's New in v1.1.3:
            - **🎬 In-App Video Player**: Watch and inspect duplicate videos directly with native hardware playback and controls.
            - **👁️ 1-Click Hide Text / Clean View**: Tap anywhere in full-screen photo/video mode or use the hide button to view media completely unobstructed.
            - **📁 Per-Folder Scan Option**: Scan specific folders (Camera, Screenshots, Downloads, WhatsApp, etc.) or all folders.
            - **✅ Hide / Finished Group Button**: Mark reviewed groups as finished or hide them with one tap.
            - **🌗 Dark & Light Mode Toggle**: Seamlessly switch between AMOLED dark mode and clean light mode.
            - **🏷️ Simplified Group Header**: Clean `#399` numbering without redundant "Group" prefix.
            - **🎨 Brand New Professional Logo & Icon**: Sleek modern emerald & cyan vector identity.
            - **✨ Animated Deletion & Space Freed Banner**: Smooth item transitions and celebratory deletion feedback.
            - **🔄 In-App APK Update Checker**: Check for updates and download the latest release APK directly inside the app.

            ### 📦 Download Assets:
            - `DupeCleaner-v1.1.3-release.apk`: Signed release build ready to install.
            - `DupeCleaner-v1.1.3-debug.apk`: Debug build with developer inspection tools.
          files: release_artifacts/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

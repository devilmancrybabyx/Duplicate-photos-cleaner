name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.1.5)'
        required: false
        default: 'v1.1.5'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build APKs with Gradle
        run: ./gradlew assembleRelease assembleDebug --stacktrace --info

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="v1.1.5"
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

      - name: Prepare APK Artifacts for Release
        id: prepare_apks
        run: |
          TAG="${{ steps.release_tag.outputs.TAG }}"
          mkdir -p release_artifacts
          
          # Find and copy release APK (versioned + permanent 'latest' alias)
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release_artifacts/DupeCleaner-${TAG}-release.apk
            cp app/build/outputs/apk/release/app-release.apk release_artifacts/DupeCleaner-release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release_artifacts/DupeCleaner-${TAG}-release.apk
            cp app/build/outputs/apk/release/app-release-unsigned.apk release_artifacts/DupeCleaner-release.apk
          fi

          # Find and copy debug APK (versioned + permanent 'latest' alias)
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release_artifacts/DupeCleaner-${TAG}-debug.apk
            cp app/build/outputs/apk/debug/app-debug.apk release_artifacts/DupeCleaner-debug.apk
          fi

          ls -la release_artifacts/

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DupeCleaner-APKs
          path: release_artifacts/*

      - name: Publish GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.TAG }}
          name: "Dupe cleaner ${{ steps.release_tag.outputs.TAG }}"
          body: |
            ## 📸 Dupe cleaner ${{ steps.release_tag.outputs.TAG }}

            ### 🚀 What's New in v1.1.5:
            - **⚡ Direct Permanent Latest Download**: Added permanent `DupeCleaner-release.apk` asset download endpoint so the README big download button always downloads the latest release APK directly.
            - **🔑 Consistent Release Keystore & Signature**: Permanent keystore integration guarantees all updates install smoothly over existing installations.
            - **🎨 Brand New App Icon & Logo**: High-resolution icons and splash branding across all Android densities.
            - **🧹 Minimalist Top Bar**: Cleaned up the app header to showcase scan counts and status.
            - **🎬 Video Player & Clean Photo View**: Hardware-accelerated video playback and 1-click unobstructed viewing.
            - **🌗 Dark / Light Mode & In-App Updates**: Full theme switcher and automatic update alerts.

            ### 📦 Download Assets:
            - `DupeCleaner-release.apk`: **Direct permanent download link** (always fetches the latest release APK).
            - `DupeCleaner-${{ steps.release_tag.outputs.TAG }}-release.apk`: Versioned signed release build.
            - `DupeCleaner-${{ steps.release_tag.outputs.TAG }}-debug.apk`: Debug build with developer inspection tools.
          files: release_artifacts/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

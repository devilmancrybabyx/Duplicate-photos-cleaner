name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.1.2)'
        required: false
        default: 'v1.1.2'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build APKs with Gradle
        run: ./gradlew assembleRelease assembleDebug --stacktrace --info

      - name: Prepare APK Artifacts for Release
        id: prepare_apks
        run: |
          mkdir -p release_artifacts
          
          # Find and copy release APK
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release_artifacts/DupeCleaner-v1.1.2-release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release_artifacts/DupeCleaner-v1.1.2-release.apk
          fi

          # Find and copy debug APK
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release_artifacts/DupeCleaner-v1.1.2-debug.apk
          fi

          ls -la release_artifacts/

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DupeCleaner-APKs
          path: release_artifacts/*

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="v1.1.2"
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.TAG }}
          name: "Dupe cleaner ${{ steps.release_tag.outputs.TAG }}"
          body: |
            ## 📸 Dupe cleaner ${{ steps.release_tag.outputs.TAG }}

            ### 🚀 Fixes & Improvements in v1.1.2:
            - **Accurate Capture & Creation Date**: Resolved real photo and video capture dates using MediaStore `DATE_TAKEN` (with fallback to `DATE_MODIFIED` and `DATE_ADDED`), ensuring real creation dates are displayed instead of duplicate batch indexing timestamps.
            - **Fixed Date Sorting**: Corrected group-level sorting for "Newest First" and "Oldest First" so that media groups and individual items sort faithfully by actual creation timestamps.
            - **Scan Cache Migration**: Backward-compatible cache deserializer automatically upgrades previous scan timestamps from seconds to milliseconds.

            ### 📦 Download Assets:
            - `DupeCleaner-v1.1.2-release.apk`: Signed release build ready to install.
            - `DupeCleaner-v1.1.2-debug.apk`: Debug build with developer inspection tools.
          files: release_artifacts/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

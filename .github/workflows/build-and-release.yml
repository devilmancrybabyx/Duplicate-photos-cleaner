name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.1.0)'
        required: false
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build APKs with Gradle
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Prepare APK Artifacts for Release
        id: prepare_apks
        run: |
          mkdir -p release_artifacts
          
          # Find and copy release APK
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release_artifacts/DupeCleaner-v1.1.0-release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release_artifacts/DupeCleaner-v1.1.0-release.apk
          fi

          # Find and copy debug APK
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release_artifacts/DupeCleaner-v1.1.0-debug.apk
          fi

          ls -la release_artifacts/

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DupeCleaner-APKs
          path: release_artifacts/*

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="v1.1.0"
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.TAG }}
          name: "Dupe cleaner ${{ steps.release_tag.outputs.TAG }}"
          body: |
            ## 📸 Dupe cleaner ${{ steps.release_tag.outputs.TAG }}

            ### ✨ What's New in v1.1.0:
            - **Scan Videos, GIFs & All Picture Formats**: Extended scanner to support MP4, MKV, 3GP, MOV, GIF, WEBP, HEIC, PNG, and JPEG with hardware thumbnail extraction and Coil video frame decoders.
            - **Share Media Directly**: Long-press any photo or video to view full-screen and tap the new **Share** button.
            - **Persistent Scan Memory**: Automatically remembers and caches your scan results across app restarts, with a "Clear Scan Memory Cache" option.
            - **Refined Material 3 UI**: Centered UI elements, beautiful radar scanning pulse animation, hamburger navigation drawer, and developer contact button.
            - **Icon-Only Group Controls**: Clean, compact icon buttons for Keep 1st Only, Delete All, and Keep All.
            - **Enhanced Accuracy**: Aspect ratio filtering and duration matching to eliminate false positives.

            ### 📦 Download Assets:
            - `DupeCleaner-v1.1.0-release.apk`: Signed release build ready to install.
            - `DupeCleaner-v1.1.0-debug.apk`: Debug build with developer inspection tools.
          files: release_artifacts/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
